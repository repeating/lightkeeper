name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching scripts/build.sh (for example v1.3.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Core tests
        run: scripts/test.sh
      - name: Isolated monitor tests
        run: scripts/test-monitors.sh
      - name: Build and verify release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          scripts/dmg.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Lightkeeper.app/Contents/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          codesign --verify --strict --deep dist/Lightkeeper.app
          ditto -c -k --sequesterRsrc --keepParent dist/Lightkeeper.app dist/Lightkeeper.zip
          cd dist
          shasum -a 256 Lightkeeper.dmg Lightkeeper.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/Lightkeeper.dmg dist/Lightkeeper.zip dist/Lightkeeper.dmg.sha256 dist/SHA256SUMS.txt --verify-tag --title "Lightkeeper ${RELEASE_TAG#v}" --notes-file docs/Release.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
